<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Free WiFi</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #111; font-family: Arial, Helvetica, sans-serif; color: white;
}
body { display: flex; align-items: center; justify-content: center; }
#portal {
  width: 90%; max-width: 420px; padding: 35px 25px; text-align: center;
  background: #222; border-radius: 15px;
}
#portal h2 { margin-top: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#continueButton {
  border: 0; border-radius: 8px; padding: 15px 30px; margin-top: 15px;
  font-size: 18px; font-weight: bold; background: white; color: #111; cursor: pointer;
}
#videoContainer {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  width: 100%; height: 100%; background: black;
}
#rickVideo { width: 100%; height: 100%; object-fit: contain; background: black; }
#fallback {
  display: none; position: absolute; left: 0; right: 0; bottom: 20px;
  text-align: center; color: white;
}
/* demo-only */
#back {
  position: absolute; top: 10px; left: 10px; z-index: 5;
  background: rgba(0,0,0,.6); color: #9cf; border: 1px solid #555; border-radius: 8px;
  padding: 6px 10px; font-family: monospace; font-size: 12px; cursor: pointer;
}
#hint { margin-top: 18px; font-size: 11px; color: #777; font-family: monospace; }
</style>
</head>
<body>
<div id="portal">
  <h2 id="secretTap">Wi-Fi Connected!</h2>
  <p>Connection successful.</p>
  <button id="continueButton" onclick="activateRickroll()">Continue to Wi-Fi</button>
  <div id="hint">Demo tip: tap the heading 5 times to open the admin page.</div>
</div>

<div id="videoContainer">
  <button id="back" onclick="location.reload()">&larr; Back to demo</button>
  <video id="rickVideo" loop playsinline preload="metadata"></video>
  <div id="fallback">Tap the video for sound</div>
</div>

<script>
// ---- Demo settings ---------------------------------------------------------
// Video played when you press the button. The path is relative to this file
// (demo/portal.html), so ../video/ is the site's video folder. Filenames are
// case-sensitive on most web hosts.
var DEMO_VIDEO = '../video/Rickroll.mp4';
// ---------------------------------------------------------------------------

var video = document.getElementById("rickVideo");
var portal = document.getElementById("portal");
var videoContainer = document.getElementById("videoContainer");
var fallback = document.getElementById("fallback");

// The 5-tap shortcut opens the matching version's admin demo (portal.html?v=1 or ?v=2)
var adminPage = (location.search.indexOf('v=1') >= 0) ? 'admin-v1.html' : 'admin-v2.html';

video.addEventListener('error', function () {
  fallback.textContent = 'Demo: video not found (' + DEMO_VIDEO + ')';
  fallback.style.display = 'block';
});

async function activateRickroll() {
  portal.style.display = "none";
  videoContainer.style.display = "block";

  video.src = DEMO_VIDEO;
  video.currentTime = 0;
  video.muted = false;
  video.volume = 1.0;

  try {
    await video.play();
  } catch (error) {
    fallback.textContent = 'Tap the video for sound';
    fallback.style.display = "block";
  }
}

videoContainer.addEventListener("click", async function(e) {
  if (e.target.id === 'back') return;
  try {
    video.muted = false;
    video.volume = 1.0;
    await video.play();
    fallback.style.display = "none";
  } catch (error) {}
});

// Hidden shortcut: tap the heading 5 times (each tap within 1.5 s of the last) to open the admin page.
var secretTaps = 0, secretTimer = null;
document.getElementById("secretTap").addEventListener("click", function () {
  secretTaps++;
  clearTimeout(secretTimer);
  secretTimer = setTimeout(function () { secretTaps = 0; }, 1500);
  if (secretTaps >= 5) {
    secretTaps = 0;
    window.location.href = adminPage;
  }
});
</script>
</body>
</html>
